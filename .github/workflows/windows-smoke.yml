name: Windows build and smoke
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Core regression checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/core | Out-Null
          dotnet run --project tests/JTCStamper.Checks -c Release 2>&1 | Tee-Object test-results/core/checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }
      - name: Build versioned distribution packages
        shell: pwsh
        run: ./scripts/New-ReleasePackages.ps1
      - name: Windows smoke (clipboard explicitly skipped)
        shell: pwsh
        run: ./scripts/Invoke-WindowsSmoke.ps1
      - name: Upload allowlisted reports and synthetic previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-smoke-${{ github.sha }}
          path: |
            test-results/core/
            test-results/windows-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload private distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ github.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
