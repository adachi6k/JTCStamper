name: Windows build and smoke
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Product version format checks
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1
      - name: Core regression checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/core | Out-Null
          dotnet run --project tests/JTCStamper.Checks -c Release 2>&1 | Tee-Object test-results/core/checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }
      - name: Storage interruption recovery (owned test processes)
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP ('jtc-storage-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $root | Out-Null
          Set-Content (Join-Path $root '.storage-failure-root') 'JTCStamper isolated storage interruption data v1'
          dotnet run --project tests/JTCStamper.StorageFailures -c Release -- --run $root
          $testExit = $LASTEXITCODE
          New-Item -ItemType Directory -Force test-results/storage | Out-Null
          $report = Join-Path $root 'storage-failures.json'
          if (Test-Path $report) { Copy-Item $report test-results/storage/ }
          if ($testExit -ne 0) { throw 'Storage interruption checks failed.' }
      - name: Build versioned distribution packages
        shell: pwsh
        run: ./scripts/New-ReleasePackages.ps1
      - name: Build and exercise per-user installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          ./scripts/New-WindowsInstaller.ps1 -IsccPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $item = Get-Content dist/installers/checksums.json -Raw | ConvertFrom-Json
          $setup = Join-Path dist/installers $item.File
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $item.Sha256) { throw 'Installer hash mismatch.' }
          $destination = Join-Path $env:LOCALAPPDATA 'Programs\JTCStamper'
          if (Test-Path $destination) { throw 'Installer test destination already exists.' }
          $process = Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $destination 'JTCStamper.App.exe'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $item.Build.ExeSha256) { throw 'Installed EXE differs from package.' }
          ./scripts/Invoke-WindowsSmoke.ps1 -StandardExe $exe
          New-Item -ItemType Directory (Join-Path $destination 'journal') | Out-Null
          Set-Content (Join-Path $destination 'journal\sentinel.txt') 'uninstall must preserve user data'
          Set-Content (Join-Path $destination 'key.dpapi') 'synthetic test key'
          $uninstall = Join-Path $destination 'unins000.exe'
          $process = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $exe) -or
              !(Test-Path (Join-Path $destination 'journal\sentinel.txt')) -or
              !(Test-Path (Join-Path $destination 'key.dpapi'))) { throw 'Uninstall failed to remove the app while preserving user data.' }
          Remove-Item -LiteralPath (Join-Path $destination 'journal\sentinel.txt'), (Join-Path $destination 'key.dpapi') -Force
          Remove-Item -LiteralPath (Join-Path $destination 'journal') -Force
          Remove-Item -LiteralPath $destination -Force
      - name: Self-signed Authenticode checks (ephemeral certificate, no trust installation)
        shell: pwsh
        run: ./scripts/Test-CodeSigning.ps1
      - name: Real disk-full recovery on a disposable 256 MiB VHD
        shell: pwsh
        run: ./scripts/Invoke-DiskFull.ps1
      - name: Windows smoke (clipboard explicitly skipped)
        shell: pwsh
        run: ./scripts/Invoke-WindowsSmoke.ps1
      - name: Upload allowlisted reports and synthetic previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-smoke-${{ github.sha }}
          path: |
            test-results/core/
            test-results/storage/
            test-results/disk-full/
            test-results/windows-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload private distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ github.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ github.sha }}
          path: dist/installers/
          if-no-files-found: error
          retention-days: 14

  migration-export:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      # Public synthetic fixture context, never a real backup password.
      JTC_MIGRATION_TEST_CONTEXT: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Export synthetic migration archive under source Windows identity
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP ('jtc-migration-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $root | Out-Null
          Set-Content (Join-Path $root '.migration-root') 'JTCStamper synthetic migration test v1'
          "MIGRATION_ROOT=$root" >> $env:GITHUB_ENV
          dotnet run --project tests/JTCStamper.Migration -c Release -- export $root
          if ($LASTEXITCODE -ne 0) { throw 'Migration export failed.' }
      - name: Transfer only synthetic encrypted fixture and comparison hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-migration-fixture
          path: |
            ${{ env.MIGRATION_ROOT }}/transfer/fixture.jtcportable
            ${{ env.MIGRATION_ROOT }}/transfer/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload export report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-export-report
          path: ${{ env.MIGRATION_ROOT }}/migration-export.json
          if-no-files-found: warn
          retention-days: 14
  migration-import:
    needs: migration-export
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      JTC_MIGRATION_TEST_CONTEXT: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Prepare destination on separate Windows host
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP ('jtc-migration-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $root | Out-Null
          Set-Content (Join-Path $root '.migration-root') 'JTCStamper synthetic migration test v1'
          "MIGRATION_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthetic-migration-fixture
          path: ${{ env.MIGRATION_ROOT }}/transfer
      - name: Verify different machine and identity, restore and authenticate originals
        shell: pwsh
        run: |
          dotnet run --project tests/JTCStamper.Migration -c Release -- import $env:MIGRATION_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Cross-machine migration failed.' }
      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-import-report
          path: ${{ env.MIGRATION_ROOT }}/migration-import.json
          if-no-files-found: warn
          retention-days: 14
