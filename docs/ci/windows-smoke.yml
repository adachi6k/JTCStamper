# Template only: copy to .github/workflows/windows-smoke.yml when enabling GitHub Actions.
name: Windows smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core checks
        run: dotnet run --project tests/JTCStamper.Checks -c Release
      - name: Publish both variants
        shell: cmd
        run: publish-all.cmd
      - name: Windows smoke (clipboard explicitly skipped)
        shell: pwsh
        run: ./scripts/Invoke-WindowsSmoke.ps1
      - name: Upload reports and synthetic previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-results
          path: test-results/windows-smoke/
          if-no-files-found: warn
          retention-days: 14
